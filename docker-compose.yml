# LMEW local/production-style stack.
# From this directory: docker compose up -d --build
name: lmew

services:
  supabase:
    build:
      context: .
      dockerfile: docker/supabase.Dockerfile
    image: lmew-supabase-cli:2.120.0
    restart: unless-stopped
    stop_grace_period: 2m
    environment:
      PUBLIC_SUPABASE_URL: ${PUBLIC_SUPABASE_URL:-http://localhost:54321}
    volumes:
      # Destination must stay /workspace. The entrypoint maps it back to the host path
      # so the Supabase CLI can bind-mount migrations and Edge Functions.
      - .:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"
    cap_add:
      # Lets the entrypoint bind-mount the repo onto the host path. The CLI
      # uses that path for sibling container mounts. The Docker socket is the
      # stronger privilege; this capability only fixes the path.
      - SYS_ADMIN
    security_opt:
      # The default AppArmor profile blocks mount(2) even with SYS_ADMIN.
      - apparmor:unconfined
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "test -s /workspace/docker/runtime/env.js && curl -fsS http://host.docker.internal:54321/auth/v1/health >/dev/null",
        ]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 600s

  admin-web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        APP_FILTER: "@lmew/admin-web"
        APP_DIR: apps/admin-web
    image: lmew-admin-web:local
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - ./docker/runtime/env.js:/usr/share/nginx/html/env.js:ro
    depends_on:
      supabase:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETGID
      - SETUID
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  staff-web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        APP_FILTER: "@lmew/staff-web"
        APP_DIR: apps/staff-web
    image: lmew-staff-web:local
    restart: unless-stopped
    ports:
      - "3001:80"
    volumes:
      - ./docker/runtime/env.js:/usr/share/nginx/html/env.js:ro
    depends_on:
      supabase:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETGID
      - SETUID
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
