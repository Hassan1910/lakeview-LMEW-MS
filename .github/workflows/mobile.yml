name: mobile
on:
  pull_request:
  push:
    tags: ['v*']
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lmew/shared-types build && pnpm --filter @lmew/supabase-client build && pnpm --filter @lmew/ui-tokens build
      - run: pnpm --filter @lmew/shared-types lint
      - run: pnpm --filter @lmew/mobile lint
      - run: pnpm --filter @lmew/mobile typecheck
      - run: pnpm --filter @lmew/shared-types test
      - name: EAS preview build
        if: github.event_name == 'pull_request'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        working-directory: apps/mobile
        run: |
          if [ -n "$EXPO_TOKEN" ]; then npx eas-cli build --profile preview --non-interactive --no-wait; else echo "EXPO_TOKEN is not set; preview build skipped"; fi
      - name: EAS production build
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        working-directory: apps/mobile
        run: |
          if [ -n "$EXPO_TOKEN" ]; then npx eas-cli build --profile production --non-interactive --no-wait; else echo "EXPO_TOKEN is not set; production build skipped"; fi
