name: supabase
on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lmew/shared-types test
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Push database and functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "Supabase deploy secrets are not set; push skipped"
            exit 0
          fi
          supabase link --project-ref "$SUPABASE_PROJECT_ID"
          supabase db push
          supabase functions deploy create-paystack-payment
          supabase functions deploy paystack-webhook
          supabase functions deploy generate-pdf
          supabase functions deploy send-notification
          supabase functions deploy low-stock-cron
          supabase functions deploy overdue-invoice-cron
